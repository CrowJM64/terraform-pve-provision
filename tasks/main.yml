---
# tasks file for terraform-pve-provision
- name: Create required groups
  ansible.builtin.group:
    name: "{{ item.groups }}"
    system: false
    state: present
  loop: "{{ ssh_users_and_keys }}"

- name: Ensure SSH Users Exist
  ansible.builtin.user:
    name: "{{ item.user }}"
    shell: /bin/bash
    groups: "{{ item.groups }}"
    append: true
  loop: "{{ ssh_users_and_keys }}"

- name: Add User to Sudo (DEB)
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: sudo
    append: true
  loop: "{{ ssh_users_and_keys }}"
  when:
    - item.admin == true
    - ansible_facts['os_family'] == "Debian"

- name: Ensure SSH Directories Exist
  ansible.builtin.file:
    path: "/home/{{ item.user }}/.ssh"
    state: directory
    owner: "{{ item.user }}"
    mode: '0700'
  loop: "{{ ssh_users_and_keys }}"

- name: Deploy SSH PubKeys for SSH Users
  ansible.posix.authorized_key:
    user: "{{ item.user }}"
    state: present
    key: "{{ item.key }}"
  loop: "{{ ssh_users_and_keys }}"

