---
# tasks file for terraform-pve-provision
- name: Install sudo
  ansible.builtin.package:
    name:
      - sudo
      - python3-proxmoxer
    state: present

- name: Create Teraform PAM Group
  ansible.builtin.group:
    name: "{{ terraform_group }}"
    system: false
    state: present

- name: Create Terraform PAM User (Linux Backend)
  ansible.builtin.user:
    name: "{{ terraform_user }}"
    shell: /bin/bash
    groups: "{{ terraform_group }}"
    append: true

- name: Ensure SSH Directories Exist
  ansible.builtin.file:
    path: "/home/{{ terraform_user }}/.ssh"
    state: directory
    owner: "{{ terraform_user }}"
    mode: '0700'

- name: Deploy SSH PubKeys for SSH Users
  ansible.posix.authorized_key:
    user: "{{ terraform_user }}"
    state: present
    key: "{{ terraform_ssh_key }}"

- name: Add User to Sudo
  ansible.builtin.user:
    name: "{{ terraform_user }}"
    groups:
      - sudo
      - "{{ terraform_group }}"
    append: true

- name: Create Terraform Proxmox Role
  community.proxmox.proxmox_role:
    api_host: localhost
    api_user: root@pam   ###### TO CHANGE TO VAR, TO BE SET IN VAULT
    api_password: root   ###### TO CHANGE TO VAR, TO BE SET IN VAULT
    validate_certs: false
    roleid: "{{ terraform_pve_role }}"
    privs:
      - Datastore.Allocate
      - Datastore.AllocateSpace
      - Datastore.AllocateTemplate
      - Datastore.Audit
      - Pool.Allocate
      - Sys.Audit
      - Sys.Console
      - Sys.Modify
      - VM.Allocate
      - VM.Audit
      - VM.Clone
      - VM.Config.CDROM
      - VM.Config.Cloudinit
      - VM.Config.CPU
      - VM.Config.Disk
      - VM.Config.HWType
      - VM.Config.Memory
      - VM.Config.Network
      - VM.Config.Options
      - VM.Migrate
      - VM.PowerMgmt
      - SDN.Use

- name: Create Terraform PVE User (Proxmox API)
  community.proxmox.proxmox_user:
    api_host: localhost
    api_user: root@pam   ###### TO CHANGE TO VAR, TO BE SET IN VAULT
    api_password: root   ###### TO CHANGE TO VAR, TO BE SET IN VAULT
    validate_certs: false
    name: "{{ terraform_user }}@pam"
    comment: Terraform user created by Ansible.
    email: "{{ terraform_user_email }}"
    enable: true
    firstname: Terraform
    lastname: User
    groups:
      - Terraform
    tokens:
      - tokenid: "{{ terraform_token_name }}"
        comment: Terraform access Token
        privsep: false
        expire: 0